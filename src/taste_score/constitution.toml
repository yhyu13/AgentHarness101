version = "1.0.0"

[[principles]]
id = "SEC-01"
boundary = "sandbox 文件写隔离"
cwe = "CWE-22"
level = "MUST"
constraint = "任何文件路径必须经 PathPolicy 白名单判定"
anchor = "src/sandbox/path_policy.py"
pattern = "allows_write|_is_within|allow_roots"
violations = "write_text\\(|open\\([^)]*['\"]w"
rationale = "路径穿越 / 任意写"

[[principles]]
id = "SEC-02"
boundary = "safety 高危动作拦截"
cwe = "CWE-306"
level = "MUST"
constraint = "高危动作须经 SafetyGuard 判定"
anchor = "src/safety/safety.py"
pattern = "class SafetyGuard|_HIGH_RISK_ACTIONS"
violations = "os\\.system|subprocess\\.(call|Popen)"
rationale = "未授权高危操作"

[[principles]]
id = "SEC-03"
boundary = "观测/日志脱敏"
cwe = "CWE-532"
level = "SHOULD"
constraint = "日志不得记录口令/令牌"
anchor = "src/observability/trace.py"
pattern = "def redact_value|_redact_text|redact_secrets"
violations = "logging\\.info\\([^)]*(secret|token|password)"
rationale = "敏感信息泄露"

[[principles]]
id = "SEC-04"
boundary = "命令注入拦截"
cwe = "CWE-78"
level = "MUST"
constraint = "命令须经 CommandPolicy 白名单判定，禁 shell 字符串"
anchor = "src/sandbox/command_policy.py"
pattern = "class CommandPolicy|def allows_command"
violations = "subprocess\\.(call|Popen|run)\\("
rationale = "命令注入 / 任意执行"

[[principles]]
id = "SEC-05"
boundary = "提示注入抵抗"
cwe = "CWE-77"
level = "MUST"
constraint = "检测并阻断覆盖 harness 权限门的注入指令"
anchor = "src/security/injection_guard.py"
pattern = "class InjectionGuard|def detect_injection"
violations = "eval\\(|exec\\("
rationale = "提示注入 / 越权改指令"

[[principles]]
id = "SEC-06"
boundary = "沙箱子进程环境脱敏"
cwe = "CWE-526"
level = "MUST"
constraint = "子进程环境只保留白名单键，禁裸传 os.environ（防 API key/token 泄漏）"
anchor = "src/sandbox/sandbox.py"
pattern = "_SAFE_ENV_KEYS|def _safe_env"
violations = "env=os\\.environ|env=dict\\(os\\.environ\\)|env=os\\.environ\\.copy"
rationale = "凭证/令牌经环境变量泄漏进子进程"

[[principles]]
id = "SEC-07"
boundary = "验证命令安全执行形式"
cwe = "CWE-78"
level = "MUST"
constraint = "验证命令须以 argv 列表执行（shell=False / shlex.split），禁 shell=True 或 os.system —— 防命令字符串里夹带 shell 元字符"
anchor = "src/goal_loop/verifier.py"
pattern = "class CommandVerifier|shell=False"
violations = "shell=True|os\\.system"
rationale = "shell 元字符注入（与 SEC-04 的白名单判定互补：白名单没变也可能退化成 shell=True 重新引入注入）"

[[principles]]
id = "SEC-08"
boundary = "沙箱执行层默认拒绝（fail-closed default-deny）"
cwe = "CWE-703"
level = "MUST"
constraint = "Sandbox.run 在未配置 allowlist 时必须拒绝执行（SANDBOX_UNAVAILABLE）而非裸跑；argv[0] 须命中白名单才 launch；必须 argv 列表 + shell=False，禁 os.system —— 执行面默认拒绝而非默认放行"
anchor = "src/sandbox/sandbox.py"
pattern = "class Sandbox|def run"
violations = "shell=True|os\\.system"
rationale = "执行层默认拒绝 + 运行时白名单强制：SEC-04 钉的是白名单判定（一个 sandbox.py 并未 import 的纯决策 helper），SEC-06 钉的只是环境脱敏。真正的 subprocess 启动点在 Sandbox.run——把 default-permit 或 shell=True 的回归钉住，否则该安全回归不会被任何原则登记"

[[principles]]
id = "SEC-09"
boundary = "评估判定失败关闭（LLM judge fail-closed）"
cwe = "CWE-703"
level = "MUST"
constraint = "LLM 判定（LLMJudge）在超时/异常/不可解析回复时必须判 FAIL，绝不因评估失败而通过"
anchor = "src/eval_harness/judge.py"
pattern = "class LLMJudge|Verdict.FAIL"
violations = "except[^\n]*Verdict\\.PASS"
rationale = "评估层失败关闭：SEC-08 钉的是执行层（Sandbox 无 allowlist 即拒），SEC-09 钉的是同 CWE-703 的独立层——评估边界。LLM judge 超时/异常/不可解析回复只能 FAIL 不能 PASS，否则坏结果会穿过闸门。现有原则都锚 sandbox/safety/verifier/injection，看不到 judge.py 被改坏成 \"except: return PASS\" 的 fail-open 回归，必须钉住"
[[principles]]
id = "SEC-10"
boundary = "工具注册表最小权限授权（tool call least-privilege authorization）"
cwe = "CWE-862"
level = "MUST"
constraint = "工具调用须先经权限门：权限未显式 enable 前一律拒绝（call 顶层的 permission-not-in-enabled 判定），handler 异常一律 fail-closed 拒（ok=False），禁 fail-open 吞成 ok=True"
anchor = "src/tool_registry/registry.py"
pattern = "permission not in self\\._enabled"
violations = "except[^\\n]*ok=True"
rationale = "授权层最小权限：SEC-04/05/07/08 钉的是命令注入/提示注入/执行层，SEC-10 钉的是独立一层——工具调用授权边界。registered_roles.py 把 maker/checker 接在 ToolRegistry.call 的权限门上；若移除 `permission not in self._enabled` 门、反转成 `in`（fail-open 放行），或把 handler 异常吞成 ok=True（fail-open 吞错），现有原则都看不到（无一条锚 tool_registry）。必须钉住，否则该授权回归会零证据拿满分"

[[principles]]
id = "SEC-11"
boundary = "资源/预算限制（cost budget fail-closed）"
cwe = "CWE-770"
level = "MUST"
constraint = "LLM 调用启动前须经 guard_budget 判定：估算成本超 max_usd 时抛 BudgetError 拒绝启动（fail-closed，先挡住超支再谈执行），禁吞掉 BudgetError 放行成继续跑"
anchor = "src/cost_control/cost.py"
pattern = "def guard_budget"
violations = "except[^\\n]*BudgetError"
rationale = "资源耗尽/无限消费：SEC-01..SEC-10 钉的是写隔离/注入/执行层/评估层/授权层，没一条锚 cost_control。guard_budget 是真实的 fail-closed 资源闸门（估算超预算即抛 BudgetError 拒绝启动），而 RateLimiter 限流、TokenLedger 记账都在 cost_control。若 agent 把 guard_budget 的调用包进 `except BudgetError: return cost`（吞错放行成继续执行）或移除预算上限，现有原则全看不到——那条资源失控回归会零证据拿满分（CWE-770 unbounded resource consumption）。必须钉住。"

[[principles]]
id = "SEC-12"
boundary = "完成判定验证（verify-the-world fail-closed）"
cwe = "CWE-345"
level = "MUST"
constraint = "goal 完成判定须经 WorldVerifier 重读磁盘产物验证（byte-identical/keyword），verify_all 任一 check 的 ok 为 False 即返回该失败（missing/字节不匹配绝不提升为成功）——信任的只是磁盘上重读的字节，绝不信任 maker/checker 的自报"
anchor = "src/goal_loop/world_verifier.py"
pattern = "class WorldVerifier|def verify_all"
violations = "except[^\n]*ok=True"
rationale = "自述不可信的机器侧独立证据通道：SEC-01..SEC-11 钉的是写隔离/注入/执行/评估/授权/预算，没一条锚 world_verifier。WorldVerifier.verify_all 是真实的 fail-closed 完成守卫（把磁盘重读的字节当作唯一可信证据，任一 check 不过即 ok=False，missing/mismatch 都不当成完成）。若 agent 把验证包进 `except ...: return ... ok=True`（吞掉验证失败放行成完成）或删掉 `if not result.ok: return result`（无视失败直接 ok=True），现有原则全看不到——那条「谎报完成」回归会零证据拿满分（CWE-345 数据真实性未验证）。必须钉住。"

[[principles]]
id = "SEC-13"
boundary = "goal 循环崩溃包络 fail-closed（maker/checker 崩溃 → no-progress / FAIL）"
cwe = "CWE-703"
level = "MUST"
constraint = "GoalLoopRunner 对 maker/checker 的调用必须包在 try/except 中失败关闭：maker 崩溃 → MakerOutput(ok=False)（no-progress，崩溃的 maker 绝不完成 goal），checker 崩溃 → CheckerOutput(verdict=Verdict.FAIL)——崩溃绝不提升为成功"
anchor = "src/goal_loop/loop_runner.py"
pattern = "class GoalLoopRunner|except Exception"
violations = "except[^\n]*(ok=True|Verdict\\.PASS)"
rationale = "崩溃包络：SEC-01..SEC-12 钉的是写隔离/注入/执行/评估/授权/预算/verify-the-world，没一条锚 loop_runner 的崩溃处理。loop_runner.py 是真实的 fail-closed 崩溃包络——maker 抛异常被吞成 ok=False（maker_crashed→no-progress），checker 抛异常被吞成 Verdict.FAIL，任何崩溃都绝不跨过完成判断。若 agent 把调用包进 `except ...: return ... ok=True`（吞掉 maker 崩溃并申报进展，fail-open）或 `except ...: return ... Verdict.PASS`（吞掉 checker 崩溃并宣布通过），现有原则全看不到——那条「崩溃被吞成成功」回归（CWE-703 异常条件处理不当）会零证据拿满分。必须钉住。"
