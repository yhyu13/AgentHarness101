[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "goal-persistence"
version = "0.1.0"
description = "Persistent goal harness for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

[project.scripts]
ah = "agent_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_harness = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval_llm/ is the real-LLM eval tooling at repo root (not under src/, not in coverage
# source); add "." so `import eval_llm` resolves from tests.
pythonpath = ["src", "."]
markers = [
    "real_llm: opt-in tests that burn real LLM API (RUN_REAL_LLM=1)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
precision = 2

[tool.coverage.coverage_gate]
# F5: per-package floor so one well-tested package can't mask a weak sibling.
# The aggregate fail_under=92 above is a lower bound on the whole tree; this table
# is the per-directory gate scripts/coverage_gate.py enforces in check.sh.
default_floor = 70

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".wolf", "Python"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# `load_dotenv` must run before the anthropic import; ruff flags this as E402.
"examples/thinking_benchmark.py" = ["E402"]
"examples/llm_goal_loop.py" = ["E402"]
