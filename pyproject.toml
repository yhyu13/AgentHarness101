[project]
name = "goal-persistence"
version = "0.1.0"
description = "Persistent goal harness for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# eval_llm/ is the real-LLM eval tooling at repo root (not under src/, not in coverage
# source); add "." so `import eval_llm` resolves from tests.
pythonpath = ["src", "."]
markers = [
    "real_llm: opt-in tests that burn real LLM API (RUN_REAL_LLM=1)",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".wolf"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# `load_dotenv` must run before the anthropic import; ruff flags this as E402.
"examples/thinking_benchmark.py" = ["E402"]
"examples/llm_goal_loop.py" = ["E402"]
