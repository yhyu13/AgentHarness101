[project]
name = "goal-persistence"
version = "0.1.0"
description = "Persistent goal harness for AI agents"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "examples/*",
]

[tool.coverage.report]
fail_under = 92
show_missing = true
precision = 2
